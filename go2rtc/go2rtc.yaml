# go2rtc – pretočni strežnik za VisionOne (tokove kamer dodaja VisionOne samodejno)
api:
  listen: ":1984"        # samo znotraj Dockerja; brskalnik dostopa prek VisionOne (/go2rtc)
  origin: "*"
rtsp:
  listen: ":8554"        # RTSP restream: rtsp://<strežnik>:8554/cam_<id> (npr. za Home Assistant)
webrtc:
  listen: ":8555"
  candidates:
    - ${HOST_IP:127.0.0.1}:8555   # IP računalnika z Docker Desktop (nastavite HOST_IP v .env)
    - stun:8555
ffmpeg:
  bin: ffmpeg
log:
  level: warn
